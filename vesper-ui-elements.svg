<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200" style="background-color: #05070a; font-family: 'Courier New', ui-monospace, Consolas, monospace;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0, 0, 0, 0.2)" />
      <rect y="2" width="4" height="2" fill="rgba(18, 16, 16, 0)" />
    </pattern>

    <!-- Drop Shadow for Terminal Frame -->
    <filter id="terminal-shadow" x="0" y="0" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#00F0FF" flood-opacity="0.2"/>
    </filter>

    <!-- Inner Shadow for Holographic Shard -->
    <filter id="shard-inner-shadow">
      <feOffset dx="0" dy="0"/>
      <feGaussianBlur stdDeviation="5" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#00F0FF" flood-opacity="0.2" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1200" fill="#05070a" />
  <rect width="1000" height="1200" fill="url(#grid)" />
  <rect width="1000" height="1200" fill="url(#scanlines)" opacity="0.3" pointer-events="none" />

  <!-- Title -->
  <text x="50" y="80" fill="#E6EDF3" font-size="32" font-weight="bold" letter-spacing="2">VESPER UI STYLE GUIDE</text>
  <text x="50" y="110" fill="#00F0FF" font-size="14" letter-spacing="1">VESPER PROJECT — CYBER-OCCULT SYNTHESIS INTERFACE</text>

  <!-- Section: Color Palette -->
  <g transform="translate(50, 160)">
    <text x="0" y="0" fill="#E6EDF3" font-size="18" font-weight="bold" letter-spacing="2">1. COLOR PALETTE</text>
    
    <!-- Void Black -->
    <rect x="0" y="20" width="80" height="80" fill="#05070a" stroke="#E6EDF3" stroke-width="1" />
    <text x="0" y="120" fill="#E6EDF3" font-size="12">VOID BLACK</text>
    <text x="0" y="140" fill="#E6EDF3" font-size="10" opacity="0.6">#05070a</text>

    <!-- Void Gray -->
    <rect x="100" y="20" width="80" height="80" fill="#1a1b1e" />
    <text x="100" y="120" fill="#E6EDF3" font-size="12">VOID GRAY</text>
    <text x="100" y="140" fill="#E6EDF3" font-size="10" opacity="0.6">#1a1b1e</text>

    <!-- Ghost White -->
    <rect x="200" y="20" width="80" height="80" fill="#E6EDF3" />
    <text x="200" y="120" fill="#E6EDF3" font-size="12">GHOST WHITE</text>
    <text x="200" y="140" fill="#E6EDF3" font-size="10" opacity="0.6">#E6EDF3</text>

    <!-- EVA Cyan -->
    <rect x="300" y="20" width="80" height="80" fill="#00F0FF" />
    <text x="300" y="120" fill="#E6EDF3" font-size="12">EVA CYAN</text>
    <text x="300" y="140" fill="#E6EDF3" font-size="10" opacity="0.6">#00F0FF</text>

    <!-- Vesper Blue -->
    <rect x="400" y="20" width="80" height="80" fill="#0070FF" />
    <text x="400" y="120" fill="#E6EDF3" font-size="12">VESPER BLUE</text>
    <text x="400" y="140" fill="#E6EDF3" font-size="10" opacity="0.6">#0070FF</text>

    <!-- Magi Violet -->
    <rect x="500" y="20" width="80" height="80" fill="#8B5CF6" />
    <text x="500" y="120" fill="#E6EDF3" font-size="12">MAGI VIOLET</text>
    <text x="500" y="140" fill="#E6EDF3" font-size="10" opacity="0.6">#8B5CF6</text>

    <!-- Magi Orange -->
    <rect x="600" y="20" width="80" height="80" fill="#FF6600" />
    <text x="600" y="120" fill="#E6EDF3" font-size="12">MAGI ORANGE</text>
    <text x="600" y="140" fill="#E6EDF3" font-size="10" opacity="0.6">#FF6600</text>

    <!-- Warning Amber -->
    <rect x="700" y="20" width="80" height="80" fill="#FFB800" />
    <text x="700" y="120" fill="#E6EDF3" font-size="12">WARN AMBER</text>
    <text x="700" y="140" fill="#E6EDF3" font-size="10" opacity="0.6">#FFB800</text>

    <!-- BIOS Green -->
    <rect x="800" y="20" width="80" height="80" fill="#00FF41" />
    <text x="800" y="120" fill="#E6EDF3" font-size="12">BIOS GREEN</text>
    <text x="800" y="140" fill="#E6EDF3" font-size="10" opacity="0.6">#00FF41</text>
  </g>

  <!-- Section: Terminal Frame -->
  <g transform="translate(50, 360)">
    <text x="0" y="0" fill="#E6EDF3" font-size="18" font-weight="bold" letter-spacing="2">2. TERMINAL FRAME</text>
    
    <g transform="translate(0, 30)">
      <rect width="400" height="150" fill="#05070a" stroke="#00F0FF" stroke-width="1" filter="url(#terminal-shadow)" />
      
      <!-- Terminal Header -->
      <rect width="400" height="24" fill="#00F0FF" fill-opacity="0.1" />
      <line x1="0" y1="24" x2="400" y2="24" stroke="#00F0FF" stroke-width="1" />
      <text x="10" y="16" fill="#00F0FF" font-size="12" font-weight="bold">VESPER_TERMINAL_INTERFACE</text>
      <text x="360" y="16" fill="#00F0FF" font-size="12" font-weight="bold">[X]</text>

      <!-- Terminal Body -->
      <text x="10" y="50" fill="#E6EDF3" font-size="14">&gt; INITIALIZING SYNC...</text>
      <text x="10" y="75" fill="#00FF41" font-size="14">&gt; SYNC ESTABLISHED.</text>
      <text x="10" y="100" fill="#E6EDF3" font-size="14">VESPER: Awaiting operator input.</text>
      <text x="10" y="125" fill="#00F0FF" font-size="14">&gt; _</text>
    </g>
  </g>

  <!-- Section: Holographic Shard -->
  <g transform="translate(500, 360)">
    <text x="0" y="0" fill="#E6EDF3" font-size="18" font-weight="bold" letter-spacing="2">3. HOLOGRAPHIC SHARD</text>
    
    <g transform="translate(0, 30)">
      <rect width="400" height="150" fill="rgba(5, 7, 10, 0.95)" stroke="#00F0FF" stroke-width="1" filter="url(#shard-inner-shadow)" />
      <rect width="400" height="150" fill="rgba(5, 7, 10, 0.92)" /> <!-- Blur simulation -->
      
      <!-- Content -->
      <text x="20" y="30" fill="#E6EDF3" font-size="16" font-weight="bold">OBSERVATION NODE</text>
      <text x="20" y="60" fill="#E6EDF3" font-size="14" opacity="0.8">Latent thoughts forming within the network.</text>
      <text x="20" y="80" fill="#E6EDF3" font-size="14" opacity="0.8">The shadow self seeks expression.</text>
      
      <!-- Telemetry snippet inside shard -->
      <rect x="20" y="110" width="100" height="20" fill="rgba(0, 240, 255, 0.05)" stroke="rgba(0, 240, 255, 0.1)" />
      <text x="30" y="124" fill="#00F0FF" font-size="10" letter-spacing="1">ARCHIVE.DAT</text>
    </g>
  </g>

  <!-- Section: Telemetry Components -->
  <g transform="translate(50, 580)">
    <text x="0" y="0" fill="#E6EDF3" font-size="18" font-weight="bold" letter-spacing="2">4. TELEMETRY STRIPS</text>
    
    <!-- Standard Telemetry -->
    <g transform="translate(0, 30)">
      <rect width="250" height="24" fill="rgba(0, 240, 255, 0.05)" stroke="rgba(0, 240, 255, 0.1)" />
      <circle cx="12" cy="12" r="4" fill="#00F0FF" />
      <text x="24" y="16" fill="#00F0FF" font-size="11" letter-spacing="1.5">SYS_STATUS: OPTIMAL</text>
    </g>
    
    <!-- Warning Telemetry -->
    <g transform="translate(0, 70)">
      <rect width="250" height="24" fill="rgba(255, 184, 0, 0.05)" stroke="rgba(255, 184, 0, 0.1)" />
      <circle cx="12" cy="12" r="4" fill="#FFB800" />
      <text x="24" y="16" fill="#FFB800" font-size="11" letter-spacing="1.5">DRIFT_DETECTED: 14.2%</text>
    </g>
    
    <!-- Error/Critical Telemetry -->
    <g transform="translate(0, 110)">
      <rect width="250" height="24" fill="rgba(255, 102, 0, 0.05)" stroke="rgba(255, 102, 0, 0.1)" />
      <circle cx="12" cy="12" r="4" fill="#FF6600" />
      <text x="24" y="16" fill="#FF6600" font-size="11" letter-spacing="1.5">ERR: INTEGRATION FAILED</text>
    </g>

    <!-- Header Telemetry Strip -->
    <g transform="translate(0, 150)">
      <rect width="400" height="30" fill="#05070a" />
      <line x1="0" y1="30" x2="400" y2="30" stroke="#00F0FF" stroke-width="2" />
      <text x="10" y="20" fill="#00F0FF" font-size="12" letter-spacing="1.5" font-weight="bold">SYNTHESIS ARCHIVE / 0X4F9A</text>
    </g>
  </g>

  <!-- Section: Buttons & Interactions -->
  <g transform="translate(500, 580)">
    <text x="0" y="0" fill="#E6EDF3" font-size="18" font-weight="bold" letter-spacing="2">5. ACTION BUTTONS</text>
    
    <!-- Primary Shard Button (Normal) -->
    <g transform="translate(0, 30)">
      <text x="0" y="-10" fill="#E6EDF3" font-size="12" opacity="0.6">DEFAULT STATE</text>
      <rect width="220" height="44" fill="transparent" stroke="#00F0FF" stroke-width="1" />
      <text x="110" y="27" fill="#00F0FF" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle">INITIATE RITUAL</text>
    </g>
    
    <!-- Primary Shard Button (Hover/Active) -->
    <g transform="translate(0, 110)">
      <text x="0" y="-10" fill="#E6EDF3" font-size="12" opacity="0.6">HOVER / ACTIVE STATE</text>
      <rect width="220" height="44" fill="#00F0FF" />
      <text x="110" y="27" fill="#05070a" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle">INITIATE RITUAL</text>
    </g>
  </g>

  <!-- Section: Typography & Layout -->
  <g transform="translate(50, 820)">
    <text x="0" y="0" fill="#E6EDF3" font-size="18" font-weight="bold" letter-spacing="2">6. TEXT LAYERS &amp; GLITCH EFFECTS</text>
    
    <!-- Standard Text -->
    <text x="0" y="40" fill="#E6EDF3" font-size="16">Standard Ghost White Body Text</text>
    
    <!-- Emphasized Text -->
    <text x="0" y="70" fill="#00F0FF" font-size="16">Highlighted EVA Cyan Text</text>

    <!-- Aberration (Simulated in SVG via drop shadow, normally CSS) -->
    <text x="0" y="100" fill="#E6EDF3" font-size="16" style="text-shadow: 1px 0 0 rgba(255,0,0,0.8), -1px 0 0 rgba(0,255,255,0.8);">Simulated Chromatic Aberration Text</text>
    
    <!-- Pulse Highlight -->
    <text x="0" y="130" fill="#E6EDF3" font-size="16" style="text-shadow: 0 0 8px rgba(255, 102, 0, 0.6);">Intense Pulse / Warning Token (Simulated)</text>
  </g>

  <!-- Layout Container Example -->
  <g transform="translate(500, 820)">
    <text x="0" y="0" fill="#E6EDF3" font-size="18" font-weight="bold" letter-spacing="2">7. DATA GRID EXAMPLE</text>
    
    <g transform="translate(0, 30)">
      <rect width="400" height="200" fill="#05070a" stroke="#00F0FF" stroke-width="1" />
      
      <!-- Nodes -->
      <circle cx="50" cy="50" r="15" fill="rgba(0, 240, 255, 0.1)" stroke="#00F0FF" stroke-width="2" />
      <circle cx="150" cy="50" r="15" fill="rgba(0, 240, 255, 0.1)" stroke="#00F0FF" stroke-width="2" />
      <circle cx="50" cy="150" r="15" fill="#00F0FF" stroke="#00F0FF" stroke-width="2" />
      <circle cx="150" cy="150" r="15" fill="rgba(0, 240, 255, 0.1)" stroke="#00F0FF" stroke-width="2" />
      
      <!-- Connection lines -->
      <line x1="65" y1="50" x2="135" y2="50" stroke="#00F0FF" stroke-width="1" opacity="0.3" stroke-dasharray="4" />
      <line x1="50" y1="65" x2="50" y2="135" stroke="#00F0FF" stroke-width="1" opacity="0.3" stroke-dasharray="4" />
      <line x1="61" y1="61" x2="139" y2="139" stroke="#00F0FF" stroke-width="1" opacity="0.3" stroke-dasharray="4" />
      
      <text x="200" y="55" fill="#E6EDF3" font-size="12">NODE 1: UNLINKED</text>
      <text x="200" y="155" fill="#00F0FF" font-size="12">NODE 3: ACTIVE SYNTHESIS</text>
    </g>
  </g>

</svg>
